name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Elytra Control
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Clone Smoothiez API
        run: git clone --depth 1 https://github.com/Smootheez/Smoothiez-Api.git smoothiez-api

      - name: Prepare Smoothiez API for local build
        working-directory: smoothiez-api
        run: |
          chmod +x gradlew

          # Elytra Control depends on Smoothiez API 0.1.0+1.21.9.
          # The current Smoothiez API source is 0.1.2, so pin the cloned
          # dependency's module version to the version Elytra Control requests.
          sed -i 's/^modVersion = .*/modVersion = 0.1.0/' 1.21.9/gradle.properties

          # The publishing plugin is not available in the public plugin
          # repositories. It is only needed for Modrinth/CurseForge uploads,
          # not for producing the Maven publication consumed by Elytra Control.
          sed -i '/^import io.github.smootheez.LoaderType/d' 1.21.9/build.gradle.kts
          sed -i '/^import io.github.smootheez.curseforge.EnvironmentType/d' 1.21.9/build.gradle.kts
          sed -i '/id("io.github.smootheez.mc-mod-publisher")/d' 1.21.9/build.gradle.kts
          sed -i '/^val modReleaseType: String by project/,$d' 1.21.9/build.gradle.kts

      - name: Build and publish Smoothiez API to Maven Local
        working-directory: smoothiez-api
        run: ./gradlew :1.21.9:publishToMavenLocal

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Elytra Control
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elytra-control-build
          path: |
            build/libs/*.jar
            1.21.9/build/libs/*.jar
          if-no-files-found: error
