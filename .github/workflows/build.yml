name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Elytra Control
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Clone Smoothiez API
        run: git clone --depth 1 https://github.com/Smootheez/Smoothiez-Api.git smoothiez-api

      - name: Build and publish Smoothiez API to Maven Local
        working-directory: smoothiez-api
        run: |
          chmod +x gradlew

          # Smoothiez API's 1.21.9 module uses a private/unavailable
          # mc-mod-publisher SNAPSHOT plugin. We only need the Maven
          # publication for Elytra Control, so remove that publishing
          # configuration from the cloned dependency.
          sed -i '/^import io.github.smootheez.LoaderType/d' 1.21.9/build.gradle.kts
          sed -i '/^import io.github.smootheez.curseforge.EnvironmentType/d' 1.21.9/build.gradle.kts
          sed -i '/id("io.github.smootheez.mc-mod-publisher")/d' 1.21.9/build.gradle.kts
          sed -i '/^val modMinecraftVersion/,$d' 1.21.9/build.gradle.kts

          ./gradlew :1.21.9:publishToMavenLocal
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Elytra Control
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elytra-control-build
          path: |
            build/libs/*.jar
            1.21.9/build/libs/*.jar
          if-no-files-found: error
