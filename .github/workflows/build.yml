name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Elytra Control
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Clone Smoothiez API
        run: git clone --depth 1 https://github.com/Smootheez/Smoothiez-Api.git smoothiez-api

      - name: Prepare Smoothiez API for local build
        working-directory: smoothiez-api
        run: |
          chmod +x gradlew

          # Elytra Control requests Smoothiez API 0.1.0+1.21.9.
          sed -i 's/^modVersion = .*/modVersion = 0.1.0/' 1.21.9/gradle.properties

          # Remove only the unavailable publisher plugin and its imports.
          sed -i '/^import io.github.smootheez.LoaderType$/d' 1.21.9/build.gradle.kts
          sed -i '/^import io.github.smootheez.curseforge.EnvironmentType$/d' 1.21.9/build.gradle.kts
          sed -i '/id("io.github.smootheez.mc-mod-publisher")/d' 1.21.9/build.gradle.kts

          # Remove publisher-only property declarations, but preserve the
          # repositories and dependencies sections required for compilation.
          sed -i '/^val modReleaseType: String by project$/d' 1.21.9/build.gradle.kts
          sed -i '/^val modrinthId: String by project$/d' 1.21.9/build.gradle.kts
          sed -i '/^val curseforgeId: String by project$/d' 1.21.9/build.gradle.kts

          # Remove only the mcModPublisher block if present.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("1.21.9/build.gradle.kts")
          s = p.read_text()
          start = s.find("\nmcModPublisher {")
          if start != -1:
              depth = 0
              i = s.find("{", start)
              end = None
              for j in range(i, len(s)):
                  if s[j] == "{":
                      depth += 1
                  elif s[j] == "}":
                      depth -= 1
                      if depth == 0:
                          end = j + 1
                          break
              if end is not None:
                  s = s[:start] + s[end:]
          p.write_text(s)
          PY

      - name: Build and publish Smoothiez API to Maven Local
        working-directory: smoothiez-api
        run: ./gradlew :1.21.9:publishToMavenLocal --no-daemon

      - name: Make Gradle wrapper executable for Elytra Control
        run: |
          chmod +x gradlew
          # The Smoothiez API artifact is built with Loom 1.14.x.
          # Elytra Control must therefore use the same/newer Loom version.
          sed -i 's/^loomVersion = .*/loomVersion = 1.14.10/' gradle.properties
          grep '^loomVersion' gradle.properties

      - name: Build Elytra Control
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elytra-control-build
          path: |
            build/libs/*.jar
            1.21.9/build/libs/*.jar
          if-no-files-found: error
