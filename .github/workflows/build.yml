name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Elytra Control
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Clone Smoothiez API
        run: git clone --depth 1 https://github.com/Smootheez/Smoothiez-Api.git smoothiez-api

      - name: Prepare Smoothiez API for local build
        working-directory: smoothiez-api
        run: |
          chmod +x gradlew

          # Elytra Control requests Smoothiez API 0.1.0+1.21.9.
          sed -i 's/^modVersion = .*/modVersion = 0.1.0/' 1.21.9/gradle.properties

          # The publishing plugin is not required to create the Maven
          # publication and is not available in the public plugin repositories.
          sed -i '/^import io.github.smootheez.LoaderType/d' 1.21.9/build.gradle.kts
          sed -i '/^import io.github.smootheez.curseforge.EnvironmentType/d' 1.21.9/build.gradle.kts
          sed -i '/id("io.github.smootheez.mc-mod-publisher")/d' 1.21.9/build.gradle.kts
          sed -i '/^val modReleaseType: String by project/,$d' 1.21.9/build.gradle.kts

          # ModMenu is needed on the Java compile classpath by
          # ModMenuApiImpl.java, but must not be bundled into Smoothiez API.
          sed -i 's/modCompileOnly("com.terraformersmc:modmenu:${modmenuVersion}")/compileOnly("com.terraformersmc:modmenu:${modmenuVersion}")/' 1.21.9/build.gradle.kts

      - name: Build and publish Smoothiez API to Maven Local
        working-directory: smoothiez-api
        run: ./gradlew :1.21.9:publishToMavenLocal --no-daemon

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Elytra Control
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elytra-control-build
          path: |
            build/libs/*.jar
            1.21.9/build/libs/*.jar
          if-no-files-found: error
