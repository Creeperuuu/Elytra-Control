name: Release

on:
  push:
    tags:
      - '*' # Will trigger on any tag that starts with v (v1.0.0, v2.1.3, etc.)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # Eclipse/AdoptOpenJDK
          java-version: '17'      # Common version for recent Minecraft mods
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Elytra Control ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/libs/*.jar
            LICENSE
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}